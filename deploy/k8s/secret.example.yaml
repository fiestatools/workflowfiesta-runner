# Runner credentials — the only secret the runner needs.
#
# Do NOT commit a filled-in copy of this file. Either create the Secret
# imperatively (see deploy/k8s/README.md) or keep this encrypted with
# sealed-secrets / SOPS / External Secrets.
#
# Keys are environment-variable names so the Deployment can consume the whole
# object with `envFrom`.
apiVersion: v1
kind: Secret
metadata:
  name: workflowfiesta-runner-token
  namespace: workflowfiesta
  labels:
    app.kubernetes.io/name: workflowfiesta-runner
type: Opaque
stringData:
  # From `workflowfiesta-runner register --code RNR-...`.
  # This is the only required value — it both authenticates the runner and
  # identifies which runner it is.
  WORKFLOWFIESTA_TOKEN: "REPLACE_ME"
