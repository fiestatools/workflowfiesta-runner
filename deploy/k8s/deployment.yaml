# WorkflowFiesta self-hosted runner.
#
# Prerequisites, in order:
#   1. kubectl apply -f namespace.yaml
#   2. kubectl apply -f configmap.yaml          (edit API URL if self-hosted)
#   3. the token Secret, from `register` output:
#
#        kubectl -n workflowfiesta create secret generic \
#          workflowfiesta-runner-token \
#          --from-literal=WORKFLOWFIESTA_TOKEN=<TOKEN>
#
#   4. kubectl apply -f serviceaccount.yaml -f rbac.yaml -f deployment.yaml
#
# The token is the only required value. See deploy/k8s/README.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflowfiesta-runner
  namespace: workflowfiesta
  labels:
    app.kubernetes.io/name: workflowfiesta-runner
spec:
  # One replica only. The token is the runner's identity, so two pods sharing
  # it would both claim jobs and overwrite each other's heartbeat.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: workflowfiesta-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workflowfiesta-runner
    spec:
      serviceAccountName: workflowfiesta-runner
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: runner
          # Pin this to a release tag (e.g. :v0.11.9) for anything you care
          # about — `latest` moves under you on the next release.
          image: ghcr.io/fiestatools/workflowfiesta-runner-k8s:latest
          imagePullPolicy: IfNotPresent
          args: ["run"]
          # All tunable settings come from the ConfigMap and Secret, whose keys
          # are environment-variable names. Add or change a setting there and
          # restart — no edits to this Deployment needed.
          envFrom:
            - configMapRef:
                name: workflowfiesta-runner-config
            - secretRef:
                name: workflowfiesta-runner-token
          env:
            # These two must stay here rather than in the ConfigMap.
            #
            # KUBERNETES_NAMESPACE has to be a fieldRef, which a ConfigMap
            # cannot express. It is also the single most important value to get
            # right: the runner defaults it to "default", where this
            # ServiceAccount has no RBAC, and the failure surfaces only when
            # the first job arrives.
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Auto-detected from KUBERNETES_SERVICE_HOST, but set explicitly so
            # the mode is visible in `kubectl describe` and in the startup log.
            - name: CONTAINER_RUNTIME
              value: kubernetes
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      # The runner polls outbound over HTTP and exposes no listener, so there
      # is nothing for a readiness/liveness probe to hit. Connection health is
      # visible in the WorkflowFiesta UI via the 30s heartbeat.
      restartPolicy: Always
