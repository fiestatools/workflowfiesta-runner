# WorkflowFiesta self-hosted runner.
#
# Prerequisite: the credentials Secret, created from `register` output:
#
#   kubectl -n workflowfiesta create secret generic wf-runner-creds \
#     --from-literal=token=<TOKEN> \
#     --from-literal=runner-id=<RUNNER_ID>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflowfiesta-runner
  namespace: workflowfiesta
  labels:
    app.kubernetes.io/name: workflowfiesta-runner
spec:
  # One replica only. Two pods sharing a runner ID would both claim jobs and
  # fight over the same heartbeat/status record.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: workflowfiesta-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workflowfiesta-runner
    spec:
      serviceAccountName: workflowfiesta-runner
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: runner
          # Pin this to a release tag (e.g. :v0.11.9) for anything you care
          # about — `latest` moves under you on the next release.
          image: ghcr.io/fiestatools/workflowfiesta-runner-k8s:latest
          imagePullPolicy: IfNotPresent
          args: ["run"]
          env:
            # Point at your WorkflowFiesta instance (self-hosted installs
            # should use their own API hostname).
            - name: WORKFLOWFIESTA_API_URL
              value: https://api.workflowfiesta.com
            - name: WORKFLOWFIESTA_RUNNER_NAME
              value: k8s-runner
            - name: WORKFLOWFIESTA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: wf-runner-creds
                  key: token
            - name: WORKFLOWFIESTA_RUNNER_ID
              valueFrom:
                secretKeyRef:
                  name: wf-runner-creds
                  key: runner-id
            - name: WORKFLOWFIESTA_MAX_CONCURRENT_JOBS
              value: "4"
            - name: CONTAINER_RUNTIME
              value: kubernetes
            # Script Jobs are created in the runner's own namespace. Without
            # this the runner falls back to the "default" namespace, where it
            # has no RBAC.
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Uncomment if your Environments reference images from a private
            # registry; the named Secret is attached to each script Job.
            # - name: KUBERNETES_IMAGE_PULL_SECRET
            #   value: my-registry-creds
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      # The runner polls outbound over HTTP and exposes no listener, so there
      # is nothing for a readiness/liveness probe to hit. Connection health is
      # visible in the WorkflowFiesta UI via the 30s heartbeat.
      restartPolicy: Always
