# ValidatingAdmissionPolicy (GA in Kubernetes 1.30). Even if the runner token
# or pod is compromised, the API server only accepts Jobs from the runner SA
# that look like hardened script Jobs. Requires no extra controller.
# Kyverno or Gatekeeper users can express the same rules there instead.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: workflowfiesta-script-jobs
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: workflowfiesta
    resourceRules:
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
  matchConditions:
    - name: from-runner
      expression: request.userInfo.username == "system:serviceaccount:workflowfiesta:workflowfiesta-runner"
  variables:
    - name: pod
      expression: object.spec.template.spec
  validations:
    - expression: variables.pod.serviceAccountName == "wf-script-job"
      message: script Jobs must run as wf-script-job
    - expression: has(variables.pod.automountServiceAccountToken) && variables.pod.automountServiceAccountToken == false
      message: script Jobs must not mount a ServiceAccount token
    - expression: object.spec.template.metadata.labels["app.kubernetes.io/managed-by"] == "workflowfiesta-runner"
      message: script pods must carry the managed-by label (NetworkPolicies select on it)
    - expression: "!has(variables.pod.volumes) || variables.pod.volumes.all(v, has(v.emptyDir))"
      message: only emptyDir volumes are allowed (no Secrets, ConfigMaps, hostPath, PVCs)
    - expression: >-
        variables.pod.containers.all(c,
          (!has(c.envFrom)) &&
          (!has(c.env) || c.env.all(e, !has(e.valueFrom))))
      message: script containers may not pull values from Secrets or ConfigMaps
    - expression: "!has(variables.pod.hostNetwork) || variables.pod.hostNetwork == false"
      message: hostNetwork is not allowed
    - expression: has(object.spec.activeDeadlineSeconds) && object.spec.activeDeadlineSeconds <= 960
      message: script Jobs need activeDeadlineSeconds <= 960
    # Image allowlist. Replace the prefix with your registry/repository; keep
    # the @sha256: so only digest-pinned images pass.
    - expression: >-
        variables.pod.containers.all(c, c.image.startsWith("REGISTRY/wf-script-job@sha256:"))
      message: script images must come from the approved repository, pinned by digest
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: workflowfiesta-script-jobs
spec:
  policyName: workflowfiesta-script-jobs
  validationActions: ["Deny", "Audit"]
