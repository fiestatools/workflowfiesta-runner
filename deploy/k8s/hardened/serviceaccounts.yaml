# Two identities: the runner (talks to the Kubernetes API to manage Jobs) and
# the script pods (no Kubernetes or cloud identity at all).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workflowfiesta-runner
  namespace: workflowfiesta
  labels:
    app.kubernetes.io/name: workflowfiesta-runner
  # No IRSA / EKS Pod Identity annotation: the runner needs no cloud API.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wf-script-job
  namespace: workflowfiesta
  labels:
    app.kubernetes.io/name: wf-script-job
# No token, no RoleBinding, no IRSA / Pod Identity association.
automountServiceAccountToken: false
---
# Make the namespace default SA inert too, in case anything falls back to it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: workflowfiesta
automountServiceAccountToken: false
