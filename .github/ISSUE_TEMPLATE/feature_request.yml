name: Feature Request
description: Suggest a feature or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Please describe what you'd like and why.

  - type: input
    id: version
    attributes:
      label: Runner Version
      description: Output of `workflowfiesta-runner --version`
      placeholder: v1.2.3
    validations:
      required: false

  - type: dropdown
    id: executor
    attributes:
      label: Related Executor
      description: Is this specific to an executor?
      options:
        - All / Not specific
        - docker
        - kubernetes
        - local
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What would you like to see added or changed?
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Use Case
      description: Why do you need this? What problem does it solve?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds or alternative approaches you've considered?
    validations:
      required: false
