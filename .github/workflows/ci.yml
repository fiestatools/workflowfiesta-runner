name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install system dependencies (required by Fyne GUI)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libgl1-mesa-dev xorg-dev
      - run: go build ./...
      - run: go test ./...
