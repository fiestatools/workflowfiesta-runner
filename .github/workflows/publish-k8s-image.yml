name: Publish Kubernetes image

# Publishes the Kubernetes runner image to GHCR. Uses the workflow's own
# GITHUB_TOKEN (packages: write below) — no PAT or registry secret needed.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (defaults to the commit SHA)"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On a release: tag with the release version plus `latest`.
      # On manual dispatch: tag with the supplied tag, else the short SHA.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-k8s
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,format=short,enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/k8s/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
