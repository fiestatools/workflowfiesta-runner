name: Release

on:
  release:
    types: [ published ]

permissions:
  contents: write # required to upload release assets

jobs:
  # ── parallel builds ─────────────────────────────────────────────────────────

  build-linux-headless:
    name: Linux headless (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -tags nolocalui \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o workflowfiesta-runner-linux-amd64 \
            ./cmd/runner
      - uses: actions/upload-artifact@v4
        with:
          name: linux-headless
          path: workflowfiesta-runner-linux-amd64

  build-linux-gui:
    name: Linux GUI (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install Fyne build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev xorg-dev
      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o workflowfiesta-runner-linux-amd64-gui \
            ./cmd/runner
      - uses: actions/upload-artifact@v4
        with:
          name: linux-gui
          path: workflowfiesta-runner-linux-amd64-gui

  build-windows-headless:
    name: Windows headless (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -tags nolocalui \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o workflowfiesta-runner-windows-amd64.exe \
            ./cmd/runner
      - uses: actions/upload-artifact@v4
        with:
          name: windows-headless
          path: workflowfiesta-runner-windows-amd64.exe

  build-windows-gui:
    name: Windows GUI (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install Windows cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      - name: Build
        env:
          CGO_ENABLED: "1"
          CC: x86_64-w64-mingw32-gcc
          GOOS: windows
          GOARCH: amd64
        run: |
          go build \
            -ldflags "-s -w -H windowsgui -X main.version=${{ github.ref_name }}" \
            -o workflowfiesta-runner-windows-amd64-gui.exe \
            ./cmd/runner
      - uses: actions/upload-artifact@v4
        with:
          name: windows-gui
          path: workflowfiesta-runner-windows-amd64-gui.exe

  # macOS headless variants (cross-compiled from Linux — pure Go, no cgo).
  build-darwin-headless-amd64:
    name: macOS headless (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: amd64
        run: |
          go build -tags nolocalui \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o workflowfiesta-runner-darwin-amd64 \
            ./cmd/runner
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-headless-amd64
          path: workflowfiesta-runner-darwin-amd64

  build-darwin-headless-arm64:
    name: macOS headless (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: arm64
        run: |
          go build -tags nolocalui \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o workflowfiesta-runner-darwin-arm64 \
            ./cmd/runner
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-headless-arm64
          path: workflowfiesta-runner-darwin-arm64

  # macOS GUI: Fyne needs the native Cocoa toolchain (cgo against Apple
  # frameworks), which doesn't cross-compile from Linux. We must use a hosted
  # macOS runner.
  #
  # NOTE (2025-04): The original plan was to skip Intel GUI and only ship arm64,
  # because GitHub deprecated Intel macOS runners (macos-13) and those jobs
  # queued indefinitely. However, we now cross-compile amd64 FROM the arm64
  # runner using `clang -arch x86_64` — this works because Apple's toolchain
  # ships universal and supports cross-arch compilation natively. Both GUI
  # binaries are built on macos-latest (arm64) with no extra runner cost.
  # If this ever breaks, the headless amd64 binary (pure Go, no cgo) still
  # covers Intel Macs for CLI / server use cases.
  build-darwin-gui-arm64:
    name: macOS GUI (arm64)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: arm64
        run: |
          go build \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o workflowfiesta-runner-darwin-arm64-gui \
            ./cmd/runner
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-gui-arm64
          path: workflowfiesta-runner-darwin-arm64-gui

  build-darwin-gui-amd64:
    name: macOS GUI (amd64 / Intel)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: amd64
          CC: "clang -arch x86_64"
          CXX: "clang++ -arch x86_64"
        run: |
          go build \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o workflowfiesta-runner-darwin-amd64-gui \
            ./cmd/runner
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-gui-amd64
          path: workflowfiesta-runner-darwin-amd64-gui

  # Code signing
  # Sign Windows binaries with SSL.com cloud-hosted certificate (CodeSignTool)
  # and macOS binaries with Apple codesign + notarization. This eliminates
  # "unknown publisher" / Gatekeeper scare dialogs on install.

  sign-windows:
    name: Sign Windows binaries
    needs: [ build-windows-headless, build-windows-gui ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: windows-*
          path: dist
          merge-multiple: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Download and setup CodeSignTool
        run: |
          curl -fsSL -o CodeSignTool.zip "https://www.ssl.com/download/codesigntool-for-linux-and-macos/"
          mkdir -p CodeSignTool
          unzip -o CodeSignTool.zip -d CodeSignTool
          rm CodeSignTool.zip
          chmod +x CodeSignTool/CodeSignTool.sh

      - name: Sign Windows binaries
        env:
          WINDOWS_SIGN_USER_NAME: ${{ secrets.WINDOWS_SIGN_USER_NAME }}
          WINDOWS_SIGN_USER_PASSWORD: ${{ secrets.WINDOWS_SIGN_USER_PASSWORD }}
          WINDOWS_SIGN_CREDENTIAL_ID: ${{ secrets.WINDOWS_SIGN_CREDENTIAL_ID }}
          WINDOWS_SIGN_USER_TOTP: ${{ secrets.WINDOWS_SIGN_USER_TOTP }}
          CODE_SIGN_TOOL_PATH: "./CodeSignTool"
        run: |
          mkdir -p signed
          for exe in dist/*.exe; do
            [ -f "$exe" ] || continue
            echo "Signing $(basename "$exe")..."
            ./CodeSignTool/CodeSignTool.sh sign \
              -input_file_path="$(pwd)/$exe" \
              -output_dir_path="$(pwd)/signed" \
              -credential_id="$WINDOWS_SIGN_CREDENTIAL_ID" \
              -username="$WINDOWS_SIGN_USER_NAME" \
              -password="$WINDOWS_SIGN_USER_PASSWORD" \
              -totp_secret="$WINDOWS_SIGN_USER_TOTP"
            mv "signed/$(basename "$exe")" "$exe"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: windows-signed
          path: dist/

  sign-darwin:
    name: Sign & notarize macOS binaries
    needs:
      - build-darwin-headless-amd64
      - build-darwin-headless-arm64
      - build-darwin-gui-arm64
      - build-darwin-gui-amd64
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: darwin-*
          path: dist
          merge-multiple: true

      - name: Import signing certificate
        env:
          CSC_LINK: ${{ secrets.mac_csc_link }}
          CSC_KEY_PASSWORD: ${{ secrets.mac_csc_key_password }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::error::mac_csc_link secret is not set — skipping macOS signing"
            exit 1
          fi
          echo "$CSC_LINK" | base64 --decode > cert.p12
          KEYCHAIN="build.keychain"
          KEYCHAIN_PASS="actions"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -t 3600 "$KEYCHAIN"
          security import cert.p12 -k "$KEYCHAIN" -P "$CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          rm cert.p12
          # Auto-detect the Developer ID identity from the imported cert
          IDENTITY=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Detected signing identity: $IDENTITY"

      - name: Sign binaries
        run: |
          for bin in dist/workflowfiesta-runner-darwin-*; do
            [ -f "$bin" ] || continue
            echo "Signing $(basename "$bin")..."
            codesign --force --options runtime \
              --entitlements build/entitlements.mac.plist \
              --sign "$SIGNING_IDENTITY" \
              --timestamp \
              "$bin"
            codesign --verify --verbose "$bin"
          done

      - name: Prep notarization API key
        env:
          APPLE_API_KEY: ${{ secrets.api_key }}
          APPLE_API_KEY_ID: ${{ secrets.api_key_id }}
        run: |
          mkdir -p ~/private_keys/
          echo "$APPLE_API_KEY" > ~/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8

      - name: Notarize binaries
        env:
          APPLE_API_KEY_ID: ${{ secrets.api_key_id }}
          APPLE_API_KEY_ISSUER: ${{ secrets.api_key_issuer_id }}
        run: |
          for bin in dist/workflowfiesta-runner-darwin-*; do
            [ -f "$bin" ] || continue
            name="$(basename "$bin")"
            echo "Notarizing $name..."
            zip "${bin}.zip" "$bin"
            xcrun notarytool submit "${bin}.zip" \
              --key ~/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8 \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_KEY_ISSUER" \
              --wait
            rm "${bin}.zip"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: darwin-signed
          path: dist/

  # ── publish ─────────────────────────────────────────────────────────────────
  # Build jobs run in parallel, then signing jobs process their outputs.
  # `publish` waits for signing + linux builds, using `if: ${{ !cancelled() }}`
  # so it runs even if a single platform fails. We'd rather ship 5 of 6
  # binaries than ship none at all.

  publish:
    name: Publish release assets
    needs:
      - build-linux-headless
      - build-linux-gui
      - sign-windows
      - sign-darwin
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      # Download signed Windows & macOS artifacts
      - uses: actions/download-artifact@v4
        with:
          name: windows-signed
          path: dist
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: darwin-signed
          path: dist
        continue-on-error: true
      # Download Linux artifacts (no signing needed)
      - uses: actions/download-artifact@v4
        with:
          name: linux-headless
          path: dist
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: linux-gui
          path: dist
        continue-on-error: true

      - name: List artifacts
        working-directory: dist
        run: ls -la

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: false
