name: Release

on:
  release:
    types: [published]

permissions:
  contents: write   # required to upload release assets

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev xorg-dev \
            gcc-mingw-w64-x86-64

      - name: Create dist directory
        run: mkdir -p dist

      # ── Linux headless ────────────────────────────────────────────────────
      - name: Build Linux headless (amd64)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -tags nolocalui \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o dist/workflowfiesta-runner-linux-amd64 \
            ./cmd/runner

      # ── Linux GUI ─────────────────────────────────────────────────────────
      - name: Build Linux GUI (amd64)
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o dist/workflowfiesta-runner-linux-amd64-gui \
            ./cmd/runner

      # ── Windows headless ─────────────────────────────────────────────────
      - name: Build Windows headless (amd64)
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -tags nolocalui \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o dist/workflowfiesta-runner-windows-amd64.exe \
            ./cmd/runner

      # ── Windows GUI ───────────────────────────────────────────────────────
      - name: Build Windows GUI (amd64)
        env:
          CGO_ENABLED: "1"
          CC: x86_64-w64-mingw32-gcc
          GOOS: windows
          GOARCH: amd64
        run: |
          go build \
            -ldflags "-s -w -H windowsgui -X main.version=${{ github.ref_name }}" \
            -o dist/workflowfiesta-runner-windows-amd64-gui.exe \
            ./cmd/runner

      # ── Checksums ─────────────────────────────────────────────────────────
      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      # ── Upload to release ─────────────────────────────────────────────────
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
