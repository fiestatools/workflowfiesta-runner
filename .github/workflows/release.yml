name: Release

on:
  release:
    types: [published]

permissions:
  contents: write   # required to upload release assets

jobs:
  # ── parallel builds ─────────────────────────────────────────────────────────

  build-linux-headless:
    name: Linux headless (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build -tags nolocalui \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o workflowfiesta-runner-linux-amd64 \
            ./cmd/runner
      - uses: actions/upload-artifact@v4
        with:
          name: linux-headless
          path: workflowfiesta-runner-linux-amd64

  build-linux-gui:
    name: Linux GUI (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install Fyne build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev xorg-dev
      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o workflowfiesta-runner-linux-amd64-gui \
            ./cmd/runner
      - uses: actions/upload-artifact@v4
        with:
          name: linux-gui
          path: workflowfiesta-runner-linux-amd64-gui

  build-windows-headless:
    name: Windows headless (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          go build -tags nolocalui \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o workflowfiesta-runner-windows-amd64.exe \
            ./cmd/runner
      - uses: actions/upload-artifact@v4
        with:
          name: windows-headless
          path: workflowfiesta-runner-windows-amd64.exe

  build-windows-gui:
    name: Windows GUI (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install Windows cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      - name: Build
        env:
          CGO_ENABLED: "1"
          CC: x86_64-w64-mingw32-gcc
          GOOS: windows
          GOARCH: amd64
        run: |
          go build \
            -ldflags "-s -w -H windowsgui -X main.version=${{ github.ref_name }}" \
            -o workflowfiesta-runner-windows-amd64-gui.exe \
            ./cmd/runner
      - uses: actions/upload-artifact@v4
        with:
          name: windows-gui
          path: workflowfiesta-runner-windows-amd64-gui.exe

  # macOS headless variants (cross-compiled from Linux — pure Go, no cgo).
  build-darwin-headless-amd64:
    name: macOS headless (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: amd64
        run: |
          go build -tags nolocalui \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o workflowfiesta-runner-darwin-amd64 \
            ./cmd/runner
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-headless-amd64
          path: workflowfiesta-runner-darwin-amd64

  build-darwin-headless-arm64:
    name: macOS headless (arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: arm64
        run: |
          go build -tags nolocalui \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o workflowfiesta-runner-darwin-arm64 \
            ./cmd/runner
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-headless-arm64
          path: workflowfiesta-runner-darwin-arm64

  # macOS GUI: Fyne needs the native Cocoa toolchain (cgo against Apple
  # frameworks), which doesn't cross-compile from Linux. We must use a hosted
  # macOS runner.
  #
  # Apple Silicon (arm64) is the only macOS runner type with reliable scheduling
  # since GitHub started deprecating Intel runners in late 2025 — `macos-13`
  # (Intel/amd64) jobs commonly queue indefinitely. macos-latest currently
  # points at macos-15 (arm64). We build arm64 only and skip Intel: most users
  # of recent Macs are on Apple Silicon, and headless amd64 above still covers
  # CI / server use cases that would otherwise want an Intel binary.
  build-darwin-gui:
    name: macOS GUI (arm64)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: darwin
          GOARCH: arm64
        run: |
          go build \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o workflowfiesta-runner-darwin-arm64-gui \
            ./cmd/runner
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-gui
          path: workflowfiesta-runner-darwin-arm64-gui

  # ── publish ─────────────────────────────────────────────────────────────────
  # All build jobs above run in parallel — there are no `needs:` between them.
  # `publish` waits for them but uses `if: ${{ !cancelled() }}` so it runs even
  # if a single platform build fails or is unavailable. We'd rather ship 5 of 6
  # binaries than ship none at all.

  publish:
    name: Publish release assets
    needs:
      - build-linux-headless
      - build-linux-gui
      - build-windows-headless
      - build-windows-gui
      - build-darwin-headless-amd64
      - build-darwin-headless-arm64
      - build-darwin-gui
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          # Don't fail if a build job was skipped — we still want to ship the
          # artifacts that DID succeed. Build failures show up in the run UI.

      - name: List artifacts
        working-directory: dist
        run: ls -la

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          # We don't pin a list of files — we ship whatever the build matrix
          # produced. fail_on_unmatched_files is irrelevant when files is a
          # glob, but explicitly false in case the glob ever returns nothing.
          fail_on_unmatched_files: false
